name: merge-quality

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/quality/lint.py

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/quality/type.py

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/quality/unit.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/quality/integration.py

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate branch, commits, and PR title
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          mapfile -t commits < <(git log origin/main..HEAD --format=%s)
          args=(--branch "$BRANCH_NAME" --pr-title "$PR_TITLE")
          for subject in "${commits[@]}"; do
            args+=(--commit "$subject")
          done
          python scripts/ci/validate_git_policy.py "${args[@]}"

  merge-gate:
    name: merge-gate
    if: always()
    needs: [lint, type, unit, integration, policy]
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel job
        env:
          LINT: ${{ needs.lint.result }}
          TYPE: ${{ needs.type.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          POLICY: ${{ needs.policy.result }}
        shell: bash
        run: |
          test "$LINT" = success
          test "$TYPE" = success
          test "$UNIT" = success
          test "$INTEGRATION" = success
          test "$POLICY" = success
